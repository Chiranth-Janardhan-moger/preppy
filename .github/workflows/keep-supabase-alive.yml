name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC to prevent Supabase auto-pausing
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth Health Endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${SUPABASE_URL:-https://ijmqfippsuzwqwvtcuxm.supabase.co}"
          curl -s -f -X GET "${URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            > /dev/null
          echo "Supabase keep-alive ping successful!"
