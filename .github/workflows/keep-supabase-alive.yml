name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC to prevent Supabase auto-pausing
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth Health Endpoint
        run: |
          curl -s -f -X GET "${{ secrets.SUPABASE_URL || 'https://ijmqfippsuzwqwvtcuxm.supabase.co' }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqbXFmaXBwc3V6d3F3dnRjdXhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMjQ3MDQsImV4cCI6MjEwMDgwMDcwNH0.w9ULs-9nLxoXziIK5xZJfMtsug__TF5uXbzxLVseYhs' }}" \
            > /dev/null
          echo "Supabase keep-alive ping successful!"
